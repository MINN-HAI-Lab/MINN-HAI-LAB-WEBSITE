# Build the site and publish dist/ to GitHub Pages.
#
# Works for either kind of Pages site:
#   - an org/user site (repo named MINN-HAI-Lab.github.io) at the root, or
#   - a project site (any other repo name) under /<repo>/.
# The base path and the site URL are derived from the repository name, so
# nothing here has to change if the repo is renamed.
#
# No setup in the repository settings: the configure-pages step below enables
# Pages in "GitHub Actions" mode on the first run. (The first attempt at
# hosting used "deploy from a branch", whose built-in Jekyll build ran on the
# Astro source and failed — Q-29.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enable Pages in Actions mode
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Work out where the site will live
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "${REPO,,}" == "${OWNER}.github.io" ]]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${OWNER}.github.io" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${REPO}" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_ENV"
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
