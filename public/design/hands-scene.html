    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {

    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",

    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"

<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
</head><body>
<script type="module">
import * as THREE from 'three';

/* MINN HAI — the reach. Human hand upper-left, robot hand lower-right.
   Cursor near the centre draws both hands in and extends the index fingers.

   Theme (D-053): the canvas is already transparent (alpha:true, no clear
   colour set), so the page behind it — index.astro's #top, themed like
   the rest of the site — is what the frame's background actually shows;
   nothing here needs to change for that. The one thing that does is the
   wireframe cage (wire/wireDim): it's coloured light-on-dark, near
   invisible on the light theme's page unless swapped. See applyTheme,
   near the bottom, and the parent's postMessage handshake it answers to. */

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 220);
camera.position.set(0, 0, 7.6);

/* environment — a few emissive panels, prefiltered, so metals have something to reflect */
const pmrem = new THREE.PMREMGenerator(renderer);
const env = new THREE.Scene();
env.background = new THREE.Color(0x07090c);
const panel = (w, h, color, k, pos, target = env) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(k), side: THREE.DoubleSide }));
  m.position.copy(pos); m.lookAt(0, 0, 0); target.add(m);
};
panel(7, 3, 0xfff0dc, 7, new THREE.Vector3(2.5, 5, 3));
panel(4, 7, 0xd6e2ff, 1.6, new THREE.Vector3(-6, 0.5, 1));
panel(3, 3, 0xff5c80, 0.7, new THREE.Vector3(5, -3.5, -1));
panel(10, 10, 0x171c22, 1, new THREE.Vector3(0, 0, -9));
scene.environment = pmrem.fromScene(env, 0.05).texture;
env.traverse(o => o.geometry && o.geometry.dispose());

/* A second, near-identical environment for the prism alone: the same four
   panels — same blue fill, same pink rim, same dark backdrop — except the
   brightest one (the near-white key reflection every metal surface picks up)
   is swapped for a warm gold. Everything else the prism reflects, and every
   other reflective part of the scene, stays exactly as it was. */
const envGold = new THREE.Scene();
envGold.background = new THREE.Color(0x07090c);
panel(7, 3, 0xffd24d, 20, new THREE.Vector3(2.5, 5, 3), envGold);
panel(4, 7, 0xd6e2ff, 1.6, new THREE.Vector3(-6, 0.5, 1), envGold);
panel(3, 3, 0xff5c80, 0.7, new THREE.Vector3(5, -3.5, -1), envGold);
panel(10, 10, 0x171c22, 1, new THREE.Vector3(0, 0, -9), envGold);
// A second generator instance: PMREMGenerator reuses internal buffers across
// calls, and a second fromScene() on the same instance produced a corrupt —
// effectively black — texture rather than a second independent one.
const pmremGold = new THREE.PMREMGenerator(renderer);
const goldReflection = pmremGold.fromScene(envGold, 0.05).texture;
envGold.traverse(o => o.geometry && o.geometry.dispose());

const key = new THREE.DirectionalLight(0xffe3c6, 2.4); key.position.set(3, 4, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.45); fill.position.set(-4, -1, 3); scene.add(fill);
const rim = new THREE.DirectionalLight(0xff3b6b, 0.9); rim.position.set(0.5, -2, -4); scene.add(rim);
scene.add(new THREE.AmbientLight(0x1a2028, 0.6));

/* materials */
const skin = new THREE.MeshPhysicalMaterial({ color: 0xb98264, roughness: 0.55, metalness: 0, sheen: 0.4, sheenColor: new THREE.Color(0xffb890), sheenRoughness: 0.7 });
const nail = new THREE.MeshPhysicalMaterial({ color: 0xe6bfae, roughness: 0.32, clearcoat: 0.7, clearcoatRoughness: 0.2 });
const graphite = new THREE.MeshStandardMaterial({ color: 0x262b32, roughness: 0.42, metalness: 0.75 });
const steel = new THREE.MeshStandardMaterial({ color: 0x8e979f, roughness: 0.3, metalness: 1 });
const glow = new THREE.MeshStandardMaterial({ color: 0xd61a4a, emissive: 0xd61a4a, emissiveIntensity: 1.8, roughness: 0.4, metalness: 0 });
const glowGold = new THREE.MeshStandardMaterial({ color: 0xf2bb3e, emissive: 0xf2bb3e, emissiveIntensity: 1.8, roughness: 0.4, metalness: 0 });
const cable = new THREE.MeshStandardMaterial({ color: 0x12151a, roughness: 0.75, metalness: 0.2 });
/* wire/wireDim are the only materials that read as light-on-dark rather
   than a colour that works on either backdrop — the wireframe cage is
   meant to be felt, not seen, so it needs to sit near the background
   either way. Default to light's colour (the site's default theme);
   applyTheme (below, driven by the parent's postMessage) corrects it the
   moment the real theme is known. */
const WIRE_LIGHT = 0x1c2830, WIRE_DARK = 0x9fb3bf;
const wire = new THREE.LineBasicMaterial({ color: WIRE_LIGHT, transparent: true, opacity: 0.32 });
const wireDim = new THREE.LineBasicMaterial({ color: WIRE_LIGHT, transparent: true, opacity: 0.14 });

/* a finger: three hierarchical phalanges, curl set per frame */
function finger({ len, r, human }) {
  const root = new THREE.Group();
  const segs = [0.44, 0.32, 0.26].map(k => k * len);
  const joints = [];
  let parent = root;
  segs.forEach((L, i) => {
    const j = new THREE.Group(); parent.add(j); joints.push(j);
    const rr = r * [1, 0.9, 0.8][i];
    if (human) {
      const m = new THREE.Mesh(new THREE.CapsuleGeometry(rr, Math.max(0.01, L - rr * 0.6), 6, 20), skin); m.position.y = L / 2; j.add(m);
      const k = new THREE.Mesh(new THREE.SphereGeometry(rr * 1.03, 20, 14), skin); j.add(k);
      if (i === 2) { const n = new THREE.Mesh(new THREE.SphereGeometry(rr * 0.62, 16, 10), nail); n.scale.set(1, 1.55, 0.45); n.position.set(0, L - rr * 0.95, rr * 0.66); j.add(n); }
    } else {
      const c = new THREE.Mesh(new THREE.CylinderGeometry(rr * 0.92, rr * 0.82, Math.max(0.01, L - rr * 0.9), 8), graphite); c.position.y = L / 2; j.add(c);
      const plate = new THREE.Mesh(new THREE.BoxGeometry(rr * 1.25, Math.max(0.01, L - rr * 1.2), rr * 0.32), steel); plate.position.set(0, L / 2, rr * 0.82); j.add(plate);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(rr * 0.9, rr * 0.12, 8, 20), glow); ring.rotation.x = Math.PI / 2; ring.position.y = rr * 0.35; j.add(ring);
      const jb = new THREE.Mesh(new THREE.SphereGeometry(rr * 0.86, 14, 10), steel); j.add(jb);
      if (i === 2) { const tip = new THREE.Mesh(new THREE.SphereGeometry(rr * 0.78, 14, 10), steel); tip.position.y = L - rr * 0.35; j.add(tip); }
    }
    const next = new THREE.Group(); next.position.y = L; j.add(next); parent = next;
  });
  root.userData.joints = joints;
  root.userData.tip = parent;
  root.userData.setCurl = c => joints.forEach((j, i) => { j.rotation.x = -c * [0.9, 1.1, 0.7][i]; });
  return root;
}

/* a hand in local space: fingers +y, back of hand +z, thumb -x, forearm running down -y */
function hand(human) {
  const g = new THREE.Group();
  if (human) {
    const add = (sx, sy, sz, x, y, z) => { const m = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 20), skin); m.scale.set(sx, sy, sz); m.position.set(x, y, z); g.add(m); };
    add(0.42, 0.52, 0.135, 0, 0.04, 0);       // palm slab
    add(0.30, 0.36, 0.145, 0, 0.14, 0.01);    // low dome of the back
    add(0.20, 0.26, 0.135, -0.25, -0.14, -0.02); // thenar
    add(0.17, 0.21, 0.12, 0.24, -0.20, -0.02);   // heel
    [-0.30, -0.10, 0.10, 0.29].forEach((x, i) => add(0.085, 0.085, 0.075, x, [0.45, 0.50, 0.48, 0.40][i] - 0.02, 0.055)); // knuckle row
    const wrist = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 0.36, 6, 24), skin); wrist.position.y = -0.56; wrist.scale.set(1.05, 1, 0.72); g.add(wrist);
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.215, 0.42, 28, 28), skin); arm.position.y = -14.6; arm.scale.set(1, 1, 0.8); g.add(arm);
  } else {
    const palm = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.86, 0.20), graphite); palm.position.y = 0.05; g.add(palm);
    const plate = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.62, 0.06), steel); plate.position.set(0, 0.10, 0.12); g.add(plate);
    const slot = new THREE.Mesh(new THREE.BoxGeometry(0.40, 0.025, 0.02), glow); slot.position.set(0, -0.20, 0.16); g.add(slot);
    const wr = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.04, 10, 32), steel); wr.rotation.x = Math.PI / 2; wr.position.y = -0.42; g.add(wr);
    const wg = new THREE.Mesh(new THREE.TorusGeometry(0.245, 0.012, 8, 40), glow); wg.rotation.x = Math.PI / 2; wg.position.y = -0.52; g.add(wg);
    const wrist = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.22, 0.4, 16), graphite); wrist.position.y = -0.6; g.add(wrist);
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.46, 28, 10), graphite); arm.position.y = -14.7; g.add(arm);
    const shell = new THREE.Mesh(new THREE.CylinderGeometry(0.275, 0.33, 1.7, 10, 1, true, 0.2, Math.PI * 1.05), steel); shell.position.y = -2.15; g.add(shell);
    [-1.05, -1.7, -2.5].forEach((y, i) => { const r = new THREE.Mesh(new THREE.TorusGeometry(0.29 + i * 0.02, 0.02, 8, 32), steel); r.rotation.x = Math.PI / 2; r.position.y = y; g.add(r); });
    for (let k = 0; k < 3; k++) {
      const pts = [];
      for (let s = 0; s <= 8; s++) { const t = s / 8; pts.push(new THREE.Vector3(-0.2 + k * 0.2 + Math.sin(k * 2.1 + t * 3) * 0.05, -0.8 - t * 2.2, -0.24 - Math.abs(Math.sin(t * Math.PI)) * 0.09)); }
      g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, 0.022, 8), cable));
    }
  }
  const fdef = [
    { x: -0.30, y: 0.45, len: 1.00, r: 0.085, sp: -0.17 },
    { x: -0.10, y: 0.50, len: 1.10, r: 0.088, sp: -0.05 },
    { x: 0.10, y: 0.48, len: 1.02, r: 0.082, sp: 0.06 },
    { x: 0.29, y: 0.40, len: 0.82, r: 0.072, sp: 0.19 },
  ];
  g.userData.fingers = fdef.map(d => { const f = finger({ len: d.len, r: d.r, human }); f.position.set(d.x, d.y, 0); f.rotation.z = -d.sp; g.add(f); return f; });
  const th = finger({ len: 0.75, r: 0.095, human }); th.position.set(-0.36, -0.05, -0.04); th.rotation.set(-0.5, 0, 1.15); g.add(th);
  g.userData.thumb = th;
  return g;
}

/* rig: outer aims the hand, inner tilts the back of the hand toward the viewer */
function rig(human, tiltY) {
  const outer = new THREE.Group(); const inner = new THREE.Group(); const h = hand(human);
  h.scale.setScalar(0.80); inner.rotation.y = tiltY; inner.add(h); outer.add(inner); scene.add(outer);
  return { outer, inner, h };
}
const human = rig(true, -0.78);
const robot = rig(false, 0.78);

/* poses: rest → reach */
const P = {
  human: { rest: { x: -2.75, y: 1.05, rz: -1.97, curl: [0.38, 0.72, 0.98, 1.12], th: 0.35 }, reach: { x: -1.46, y: 0.40, rz: -1.80, curl: [0.02, 0.55, 0.88, 1.02], th: 0.3 } },
  robot: { rest: { x: 2.75, y: -0.9, rz: 1.21, curl: [0.42, 0.82, 1.02, 1.12], th: 0.4 }, reach: { x: 1.42, y: -0.32, rz: 1.06, curl: [0.0, 0.62, 0.92, 1.05], th: 0.35 } },
};

/* cybernetic field behind the gap */
const cyber = new THREE.Group(); cyber.position.set(0.05, 0.05, -1.3); scene.add(cyber);
const ring1 = new THREE.Mesh(new THREE.TorusGeometry(1.75, 0.011, 8, 160), steel); ring1.rotation.x = 1.15; cyber.add(ring1);
const arc = new THREE.Mesh(new THREE.TorusGeometry(1.75, 0.018, 8, 64, Math.PI * 0.32), glowGold); arc.rotation.x = 1.15; cyber.add(arc);
const arc2 = new THREE.Mesh(new THREE.TorusGeometry(2.15, 0.012, 8, 48, Math.PI * 0.18), glowGold); arc2.rotation.x = -0.95; cyber.add(arc2);
const ico = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(0.95, 1)), wire); cyber.add(ico);
const ico2 = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(1.45, 0)), wireDim); cyber.add(ico2);
const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.18, 0), steel.clone()); core.material.envMap = goldReflection; core.material.roughness = 0.16; core.material.needsUpdate = true; cyber.add(core);
const nodes = [];
for (let i = 0; i < 10; i++) {
  const n = new THREE.Mesh(new THREE.OctahedronGeometry(0.045 + Math.random() * 0.03, 0), i % 3 === 0 ? glowGold : steel);
  const a = Math.random() * Math.PI * 2, rr = 1.4 + Math.random() * 1.4;
  n.userData = { a, rr, z: -0.6 + Math.random() * 1.2, ph: Math.random() * 6.28, sp: 0.05 + Math.random() * 0.08 };
  cyber.add(n); nodes.push(n);
}

/* pointer — own events plus messages from a parent frame */
const ptr = { x: 0, y: 0, tx: 0, ty: 0, reach: 0, treach: 0 };
const setPtr = (nx, ny) => { if (ptr.lock) return; ptr.tx = nx; ptr.ty = ny; const d = Math.hypot(nx, ny * 0.75); ptr.treach = 1 - THREE.MathUtils.smoothstep(d, 0.10, 0.62); };
addEventListener('pointermove', e => setPtr((e.clientX / innerWidth) * 2 - 1, (e.clientY / innerHeight) * 2 - 1), { passive: true });
addEventListener('pointerleave', () => { if (!ptr.lock) ptr.treach = 0; });
addEventListener('message', e => {
  const d = e.data;
  if (!d) return;
  if (d.type === 'mh-pointer') { if (d.out) { if (!ptr.lock) ptr.treach = 0; } else setPtr(d.x, d.y); }
  if (d.type === 'mh-theme') applyTheme(d.theme === 'dark');
});
/* the parent's stylesheet has the real theme (D-052/D-053); this frame is
   a separate document and can't read it, so it asks — parent.postMessage
   rather than waiting to be told, since the parent's own script may run
   before this listener above is registered (three.js is fetched from a
   CDN first) and a message sent before there's a listener is simply lost. */
function applyTheme(dark) {
  const c = dark ? WIRE_DARK : WIRE_LIGHT;
  wire.color.setHex(c);
  wireDim.color.setHex(c);
}
if (parent !== window) parent.postMessage({ type: 'mh-ready' }, '*');

/* The artboard is 1340x920. On a wider frame the camera comes in so the frame
   shows about the same width of the scene the artboard did — but no closer
   than 0.82 of its distance, or on an ultrawide frame the hands crowd the
   edges and the top of the human hand goes under the header. Past that the
   long forearms carry it: they leave the frame at any width. On a narrower
   frame the camera stays put, so the hands keep their size. */
const ART_ASPECT = 1340 / 920, CAM_Z = 7.6;
let camZ = CAM_Z;
const resize = () => { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camZ = CAM_Z * Math.max(0.82, Math.min(1, ART_ASPECT / camera.aspect)); camera.position.z = camZ; camera.updateProjectionMatrix(); };
addEventListener('resize', resize); resize();

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const lerp = THREE.MathUtils.lerp;
const clock = new THREE.Clock();
function applyPose(r, pose, t, side) {
  const a = pose.rest, b = pose.reach;
  r.outer.position.set(lerp(a.x, b.x, t), lerp(a.y, b.y, t) + Math.sin(clock.elapsedTime * 0.6 + side) * 0.02, 0);
  r.outer.rotation.z = lerp(a.rz, b.rz, t);
  r.h.userData.fingers.forEach((f, i) => f.userData.setCurl(lerp(a.curl[i], b.curl[i], t) + Math.sin(clock.elapsedTime * 0.9 + i + side) * 0.02));
  r.h.userData.thumb.userData.setCurl(lerp(a.th, b.th, t));
}
function frame() { requestAnimationFrame(frame); tick(); }
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05) || 0.016;
  const el = clock.elapsedTime;
  const k = 1 - Math.pow(0.001, dt);
  ptr.x += (ptr.tx - ptr.x) * k * 0.7; ptr.y += (ptr.ty - ptr.y) * k * 0.7;
  ptr.reach += (ptr.treach - ptr.reach) * k * 0.55;
  const t = reduced ? 0.6 : ptr.reach;
  applyPose(human, P.human, t, 0);
  applyPose(robot, P.robot, t, 2);
  human.inner.rotation.y = -0.78 - ptr.y * 0.08;
  robot.inner.rotation.y = 0.78 + ptr.y * 0.08;
  camera.position.x = ptr.x * 0.18; camera.position.y = -ptr.y * 0.12; camera.lookAt(0, 0, 0);
  const s = reduced ? 0 : 1;
  cyber.rotation.y = ptr.x * 0.14; cyber.rotation.x = ptr.y * 0.09;
  ring1.rotation.z = el * 0.05 * s;
  arc.rotation.z = el * 0.22 * s; arc2.rotation.z = -el * 0.15 * s + 2;
  ico.rotation.y = el * 0.12 * s; ico.rotation.x = el * 0.07 * s; ico2.rotation.y = -el * 0.05 * s;
  core.rotation.y = el * 0.5 * s; core.rotation.z = el * 0.3 * s;
  core.scale.setScalar(1 + ptr.reach * 0.4);
  glow.emissiveIntensity = 1.4 + ptr.reach * 1.6 + Math.sin(el * 2.2) * 0.2;
  nodes.forEach(n => { const u = n.userData; const a = u.a + el * u.sp * s; n.position.set(Math.cos(a) * u.rr, Math.sin(a) * u.rr * 0.7 + Math.sin(el * 0.7 + u.ph) * 0.08, u.z); n.rotation.y = el * 0.6 + u.ph; });
  renderer.render(scene, camera);
}
frame();

/* debug hook for tuning: fingertip gap in world units */
window.__gap = () => { const a = new THREE.Vector3(), b = new THREE.Vector3(); human.h.userData.fingers[0].userData.tip.getWorldPosition(a); robot.h.userData.fingers[0].userData.tip.getWorldPosition(b); return { a: a.toArray().map(v => +v.toFixed(2)), b: b.toArray().map(v => +v.toFixed(2)), gap: +a.distanceTo(b).toFixed(2) }; };
window.__set = (r) => { ptr.lock = true; ptr.treach = r; ptr.reach = r; for (let i = 0; i < 3; i++) tick(); };
window.__wireHex = () => '#' + wire.color.getHexString();
</script>
</body></html>
